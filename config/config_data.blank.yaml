# 地图 / 怪物登记表（出厂空模板 —— 给用户版打包用）
#
# 这是**干净的空表**。你做好一张地图、或截好一种怪之后，
# 界面上的操作会自动往这里登记（也可以手改）。
#
# eng_to_cn:       英文ID -> 中文显示名（界面下拉显示 "henesys_west (勇士村西入口)"）
# map_mobs_mapping: 地图ID -> [怪物ID, ...]
#
# ⚠️ 英文ID 必须与 minimaps/<地图ID>/、monster/<怪物ID>/ 的目录名严格一致
#
# 用法：录完路线 / 截完怪之后，主界面会自动写这里。
#       想手动加也行，例如：
#         eng_to_cn:
#           木妖: 木妖
#         map_mobs_mapping:
#           废都南方工地: [木妖]

eng_to_cn: {}

map_mobs_mapping: {}
