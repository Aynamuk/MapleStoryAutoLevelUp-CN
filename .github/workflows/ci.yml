name: CI

# 只在改动代码/资源时触发；纯文档改动不必跑
on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ master ]
  workflow_dispatch:      # 允许在 Actions 页面手动点一次

# 为什么用 windows-latest 而不是默认的 ubuntu：
#   本项目是 Windows 专属，src/utils/common.py 与 src/input/GameWindowCapturor.py
#   在**模块顶层**就 import 了 pywin32 / windows-capture，这些包在 Linux 上装不上，
#   任何 import 到 src 的脚本都会 ModuleNotFoundError。
#   GitHub 对公开仓库的 Windows runner 同样免费。
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须取全历史（含标签）。verify_make_patch 要用
          # `git diff --name-only v1.0.2..v1.0.3` 判断两个版本间
          # 依赖有没有变（依赖变了就不许发增量补丁）。
          # checkout 的默认 fetch-depth=1 只取最新一个 commit，
          # 标签都不在 → 那条自检会直接失败。
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（全部源码与工具）
        run: python -m compileall -q src tools

      # 只跑「不依赖游戏窗口、不抓帧、不发按键」的离线自检。
      # 其余 verify_*.py 需要真实窗口/资源或会阻塞（input()），故不进 CI：
      #   verify_route            需要 tools.grab_frame 抓帧
      #   verify_home_route_health 需要真实资源跑 load_config
      #   verify_nametag_track     需要真机日志，且末尾有 input() 阻塞
      - name: 离线自检
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          $tests = @(
            'verify_home_route',
            'verify_recorder_action',
            'verify_home_restore',
            'verify_jump_cooldown',
            'verify_mob_template_qa',
            'verify_no_frame_reason',
            'verify_make_patch',
            'verify_pack_manifest',
            'verify_key_failure_visible',
            'verify_driver_precheck',
            'verify_home_none_no_crash',
            'verify_log_no_flood',
            'verify_bars_potions',
            'verify_capture_border_fallback',
            'verify_nametag_mode_fix',
            'verify_goal_unreachable_warn',
            'verify_attack_box_stale_pos',
            'verify_key_name_alias',
            'verify_ci_green_check'
          )
          # ⚠️ 注意：tools/verify_nametag_fallback_limit.py **不进 CI** ——
          #    它依赖本机真机截图（debug/ 下，不进仓库），CI 里会永远"跳过"，
          #    放进来只是装样子。它在开发机上跑（改了名字定位之后手动执行）。
          #
          # ⚠️ 注意：tools/verify_ci_green.py（发版前 CI 门禁）**也不进 CI** ——
          #    它检查的正是"当前 commit 的 CI 是否绿"，而 CI 自己跑时那个 CI
          #    正在进行中，放进来必然自相矛盾（永远 pending）。它是**发版前**
          #    给人跑的一步；但它的**判据**由 verify_ci_green_check 离线钉住。
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "===== $t ====="
            python -m "tools.$t"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "失败的自检：$($failed -join ', ')"
            exit 1
          }
          Write-Host ""
          Write-Host "全部离线自检通过（$($tests.Count) 项）"
